name: Reproduce paper results
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  results-and-predictor:
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install plotting dependencies
        run: python -m pip install -r requirements.txt
      - name: Recompute numerical results and per-instruction accuracy
        run: python scripts/reproduce.py --per-instruction --plots
      - name: Rebuild predictor and match all frozen forecasts
        run: python scripts/replay.py
      - uses: actions/upload-artifact@v4
        with:
          name: reproduced-results
          path: |
            output/results.json
            output/implementation.csv
            output/*.svg
            output/*.pdf
            output/replay/verification.json
  windows-portability:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify frozen bytes and recompute results
        run: python scripts/reproduce.py
